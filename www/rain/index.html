<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ฟ้าฝน 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="map"></div>

    <header class="topbar">
        <div class="brand">ฟ้าฝน <span>3D</span></div>
        <div id="status" class="status">กำลังโหลด…</div>
    </header>

    <!-- Layer toggles -->
    <details class="card layers" id="layers" open>
        <summary>ชั้นข้อมูล</summary>
        <label><input type="checkbox" id="lyr-cloud" checked> เมฆ Himawari (10 นาที)</label>
        <label class="sub"><input type="checkbox" id="cloud-raw"> แสดงภาพอินฟราเรดดิบ</label>
        <label><input type="checkbox" id="lyr-radar"> เรดาร์ฝน (RainViewer)</label>
        <label><input type="checkbox" id="lyr-grid"> กริดพยากรณ์ 3D (Open-Meteo)</label>
        <select id="grid-var" class="sub" disabled>
            <option value="temperature_2m">อุณหภูมิ (°C)</option>
            <option value="precipitation">ฝนชั่วโมงนี้ (มม.)</option>
            <option value="cloud_cover">เมฆปกคลุม (%)</option>
            <option value="relative_humidity_2m">ความชื้น (%)</option>
        </select>
        <div id="grid-legend" class="legend sub" hidden></div>
        <label><input type="checkbox" id="lyr-terrain" checked> ภูมิประเทศ 3D</label>
        <label><input type="checkbox" id="lyr-sat"> ภาพดาวเทียมพื้นหลัง</label>
    </details>

    <!-- Cloud animation -->
    <div class="card cloudbar" id="cloudbar">
        <button id="play" class="iconbtn" aria-label="เล่น/หยุด">▶</button>
        <input type="range" id="frame" min="0" max="0" value="0" aria-label="เวลาภาพเมฆ">
        <div id="frame-time" class="frame-time">--:--</div>
    </div>

    <!-- Forecast panel -->
    <section class="sheet" id="sheet">
        <button class="handle" id="sheet-toggle" aria-label="ย่อ/ขยาย"></button>
        <div class="now">
            <div class="now-icon" id="now-icon">⏳</div>
            <div>
                <div class="now-temp" id="now-temp">--°</div>
                <div class="now-desc" id="now-desc">แตะแผนที่หรือกดปุ่มหาตำแหน่ง</div>
                <div class="now-place" id="now-place"></div>
            </div>
        </div>
        <div class="stats" id="stats"></div>
        <h3>24 ชั่วโมงข้างหน้า</h3>
        <div id="hourly" class="hourly"></div>
        <h3>7 วัน</h3>
        <div id="daily" class="daily"></div>
        <p class="credit">ข้อมูล: <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> ·
            Himawari-9 ผ่าน <a href="https://earthdata.nasa.gov/gibs" target="_blank">NASA GIBS</a> ·
            <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a></p>
    </section>

    <!-- LINE LIFF (app 1654067025-qbv7D0Bn opens this page) -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="app.js"></script>
</body>

</html>
